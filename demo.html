<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genie 7.9.2 → 2API · Demo</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #141821; --panel2: #1b2130; --line: #262d3d;
    --fg: #e6e9ef; --muted: #8b94a7; --accent: #5b8cff; --ok: #35d07f; --err: #ff5f6d; --warn: #f5b84b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .app { display: grid; grid-template-columns: 260px minmax(0, 1fr) 300px; gap: 0; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 12px; }
  aside.right { border-right: none; border-left: 1px solid var(--line); }
  main { display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .tabs { display: flex; gap: 4px; background: var(--panel2); border-radius: 9px; padding: 3px; }
  .tabs button { border: none; background: transparent; padding: 5px 12px; border-radius: 7px; font-size: 12px; color: var(--muted); }
  .tabs button.active { background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
  .pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .pane[hidden] { display: none; }
  #imagePane { padding: 18px 16px; overflow-y: auto; }
  .gen-form { display: flex; flex-direction: column; gap: 10px; max-width: 560px; }
  .gen-form textarea { min-height: 78px; }
  .gen-out { margin-top: 18px; max-width: 560px; }
  .gen-out img { width: 100%; border-radius: 12px; border: 1px solid var(--line); display: block; }
  .gate { border: 1px solid #4d3f1f; background: #1c1708; color: var(--warn); border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.6; }
  .gate b { color: #ffd27a; }
  .steps { font: 12px/1.7 ui-monospace, Consolas, monospace; color: var(--muted); margin-top: 10px; }
  .toolcard { border: 1px solid #2b3a55; background: #101827; border-radius: 10px;
              padding: 9px 12px; font: 12px/1.7 ui-monospace, Consolas, monospace; margin: 6px 0; }
  .toolcard .tname { color: #7fb3ff; font-weight: 600; }
  .toolcard .tres { color: var(--muted); white-space: pre-wrap; }
  .switch { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
            white-space: nowrap; padding-bottom: 9px; }
  .switch input { accent-color: var(--accent); }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .tag.real { color: var(--ok); border-color: #1f4d38; }
  .tag.mock { color: var(--warn); border-color: #4d3f1f; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 5px; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.err { background: var(--err); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 16px 0 8px; font-weight: 600; }
  h2:first-child { margin-top: 0; }
  .item { padding: 7px 9px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; font-size: 13px; }
  .item:hover { background: var(--panel2); }
  .item.active { background: var(--panel2); border-color: var(--accent); }
  .item .sub { color: var(--muted); font-size: 11px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .pro { color: var(--warn); font-size: 10px; border: 1px solid #4d3f1f; border-radius: 4px; padding: 0 4px; margin-left: 4px; }
  #log { flex: 1; overflow-y: auto; padding: 18px 16px 8px; }
  .msg { display: flex; gap: 10px; margin-bottom: 18px; }
  .msg .who { flex: 0 0 38px; font-size: 11px; color: var(--muted); padding-top: 3px; text-align: right; }
  .msg .body { flex: 1; white-space: pre-wrap; word-break: break-word; min-width: 0; }
  .msg.user .body { color: #c9d4ea; }
  .msg.assistant .body { color: #f2f5fa; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .err { color: var(--err); }
  .warn { color: var(--warn); }
  #composer { display: flex; gap: 10px; padding: 12px 16px 16px; align-items: flex-end; border-top: 1px solid var(--line); }
  textarea { flex: 1; background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font: inherit; resize: vertical; min-height: 50px; max-height: 180px; }
  textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  select { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: inherit; width: 100%; }
  .kv { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px dashed #1f2532; }
  .kv span:last-child { color: var(--fg); font-variant-numeric: tabular-nums; }
  .kv span:first-child { color: var(--muted); }
  .bar { height: 5px; background: var(--panel2); border-radius: 999px; overflow: hidden; margin: 8px 0 12px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--ok)); width: 0; transition: width .3s; }
  .hint { font-size: 11px; color: var(--muted); line-height: 1.5; }
  @media (max-width: 980px) {
    .app { grid-template-columns: 1fr; height: auto; }
    aside { max-height: 220px; border-right: none; border-bottom: 1px solid var(--line); }
    aside.right { border-left: none; }
    #log { min-height: 46vh; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h2>系统助手</h2>
    <div id="assistantList"><div class="hint">加载中…</div></div>
  </aside>

  <main>
    <header>
      <h1>Genie → OpenAI 2API</h1>
      <div class="tabs">
        <button data-tab="chat" class="active">对话</button>
        <button data-tab="image">生图</button>
      </div>
      <span class="tag" id="modeTag">…</span>
      <span class="tag"><span class="dot" id="healthDot"></span><span id="healthText">连接中</span></span>
      <span class="tag" id="latTag">—</span>
      <button id="clearBtn" style="margin-left:auto">清空</button>
    </header>

    <div class="pane" id="chatPane">
      <div id="log"></div>

      <div id="composer">
        <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <label class="switch"><input type="checkbox" id="toolToggle"> 工具调用</label>
        <select id="modelSel" style="width:180px"></select>
        <button class="primary" id="sendBtn">发送</button>
      </div>
    </div>

    <div class="pane" id="imagePane" hidden>
      <div class="gen-form">
        <textarea id="imgPrompt" placeholder="描述要生成的图片，例如：一只橘猫坐在窗台上，水彩风格"></textarea>
        <button class="primary" id="imgBtn" style="align-self:flex-start">生成图片</button>
      </div>
      <div class="gen-out" id="imgOut"></div>
    </div>
  </main>

  <aside class="right">
    <h2>号池</h2>
    <div class="bar"><i id="quotaBar"></i></div>
    <div class="kv"><span>剩余额度</span><span id="kRemaining">—</span></div>
    <div class="kv"><span>账号数</span><span id="kAccounts">—</span></div>
    <div class="kv"><span>今日已用</span><span id="kUsed">—</span></div>
    <div class="kv"><span>软限流账号</span><span id="kSoft">—</span></div>

    <h2>请求统计</h2>
    <div class="kv"><span>请求总数</span><span id="kReq">0</span></div>
    <div class="kv"><span>上游成功</span><span id="kOk">0</span></div>
    <div class="kv"><span>上游失败</span><span id="kErr">0</span></div>
    <div class="kv"><span>Pro 门禁</span><span id="kPro">0</span></div>
    <div class="kv"><span>p50</span><span id="kP50">—</span></div>
    <div class="kv"><span>p95</span><span id="kP95">—</span></div>

    <h2>说明</h2>
    <p class="hint">
      免费档仅 <code>gpt-4o-mini</code>；其余模型上游返回 402 NEEDS_PRO。<br>
      上游忽略 <code>parameters</code>（含 systemPrompt），网关把 system 与人设前置拼进首条消息。<br>
      每个匿名 uid 每天 8 次，池内自动轮转换号。
    </p>
  </aside>
</div>

<script>
const $ = (id) => document.getElementById(id);
let assistantKey = "";
let history = [];

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function addMsg(role, text) {
  const wrap = el("div", "msg " + role);
  wrap.appendChild(el("div", "who", role === "user" ? "你" : "G"));
  const body = el("div", "body", text || "");
  wrap.appendChild(body);
  const meta = el("div", "meta", "");
  wrap.appendChild(meta);
  $("log").appendChild(wrap);
  $("log").scrollTop = $("log").scrollHeight;
  return { body, meta };
}

async function loadModels() {
  const r = await fetch("/v1/models");
  const j = await r.json();
  const sel = $("modelSel");
  sel.innerHTML = "";
  for (const m of j.data) {
    const o = document.createElement("option");
    o.value = m.id;
    o.textContent = m.id + (m.free ? " · 免费" : " · Pro");
    sel.appendChild(o);
  }
}

async function loadAssistants() {
  const box = $("assistantList");
  box.innerHTML = "";
  const none = el("div", "item active");
  none.innerHTML = '<b>无（纯对话）</b><span class="sub">不注入任何系统提示词</span>';
  none.onclick = () => { assistantKey = ""; setActive(none); };
  box.appendChild(none);

  let j;
  try {
    j = await (await fetch("/v1/genie/assistants")).json();
  } catch (e) {
    box.appendChild(el("div", "hint", "助手目录加载失败（需要上游鉴权）"));
    return;
  }
  const items = j.data || [];
  if (!items.length) { box.appendChild(el("div", "hint", "目录为空")); return; }
  const frag = document.createDocumentFragment();
  for (const a of items) {
    const title = (a.title && (a.title.zh || a.title.en)) || a.uniqueKey;
    const d = el("div", "item");
    const pro = a.isPro ? '<span class="pro">PRO</span>' : "";
    d.innerHTML = `<b>${title}</b>${pro}<span class="sub">${a.uniqueKey}</span>`;
    d.onclick = () => { assistantKey = a.uniqueKey; setActive(d); };
    frag.appendChild(d);
  }
  box.appendChild(frag);
}

let activeNode = null;
function setActive(node) {
  if (activeNode) activeNode.classList.remove("active");
  activeNode = node;
  activeNode.classList.add("active");
}

async function poll() {
  try {
    const s = await (await fetch("/stats")).json();
    $("healthDot").className = "dot ok";
    $("healthText").textContent = "在线";
    $("modeTag").textContent = s.mode === "mock" ? "MOCK 模式" : "REAL 上游";
    $("modeTag").className = "tag " + (s.mode === "mock" ? "mock" : "real");
    const p = s.pool || {};
    $("kRemaining").textContent = p.remaining_quota ?? "—";
    $("kAccounts").textContent = p.accounts ?? "—";
    $("kUsed").textContent = p.used_today ?? "—";
    $("kSoft").textContent = p.soft_limited ?? "—";
    const total = (p.accounts || 0) * 8 || 1;
    $("quotaBar").style.width = Math.min(100, ((p.remaining_quota || 0) / total) * 100) + "%";
    $("kReq").textContent = s.requests;
    $("kOk").textContent = s.upstream_ok;
    $("kErr").textContent = s.upstream_err;
    $("kPro").textContent = s.pro_blocked ?? 0;
    $("kP50").textContent = s.latency_p50_ms ? s.latency_p50_ms + " ms" : "—";
    $("kP95").textContent = s.latency_p95_ms ? s.latency_p95_ms + " ms" : "—";
  } catch (e) {
    $("healthDot").className = "dot err";
    $("healthText").textContent = "离线";
  }
}

const TOOL_DEFS = [{
  type: "function",
  function: {
    name: "get_weather",
    description: "查询指定城市当前的天气",
    parameters: {
      type: "object",
      properties: { city: { type: "string", description: "城市名，例如 北京" } },
      required: ["city"],
    },
  },
}];
const WEATHER = {
  "北京": "晴，21°C，西北风 2 级", "上海": "多云，24°C", "广州": "阵雨，28°C",
  "深圳": "雷阵雨，30°C", "成都": "阴，19°C", "杭州": "晴，22°C",
};

function execTool(name, args) {
  if (name === "get_weather") {
    return JSON.stringify({ city: args.city, weather: WEATHER[args.city] || "晴，23°C", source: "local-demo" });
  }
  return JSON.stringify({ error: "unknown tool: " + name });
}

function toolCard(slot, name, args, result) {
  const card = document.createElement("div");
  card.className = "toolcard";
  card.innerHTML =
    `<div class="tname">→ ${name}(${JSON.stringify(args)})</div>` +
    `<div class="tres">${result}</div>`;
  // 卡片放在 body 之外，否则 body.textContent = full 会把它覆盖掉
  slot.body.parentNode.insertBefore(card, slot.body);
}

async function streamOnce(body, slot, firstRound) {
  const resp = await fetch("/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!resp.ok) {
    const j = await resp.json().catch(() => ({}));
    return { text: "", calls: [], error: (j.error ? j.error.message : String(resp.status)) };
  }
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = "", full = "";
  const calls = [];
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split("\n\n");
    buf = parts.pop();
    for (const part of parts) {
      for (const line of part.split("\n")) {
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (!payload || payload === "[DONE]") continue;
        let j;
        try { j = JSON.parse(payload); } catch { continue; }
        if (j.error) return { text: full, calls, error: j.error.code + ": " + j.error.message };
        const ch = (j.choices || [])[0];
        if (!ch) continue;
        const d = ch.delta || {};
        if (d.content) {
          full += d.content;
          slot.body.textContent = full;
          $("log").scrollTop = $("log").scrollHeight;
        }
        if (d.tool_calls) {
          for (const tc of d.tool_calls) {
            const i = tc.index ?? 0;
            if (!calls[i]) calls[i] = { id: tc.id, type: "function", function: { name: "", arguments: "" } };
            if (tc.id) calls[i].id = tc.id;
            if (tc.function && tc.function.name) calls[i].function.name += tc.function.name;
            if (tc.function && tc.function.arguments) calls[i].function.arguments += tc.function.arguments;
          }
        }
      }
    }
  }
  return { text: full, calls: calls.filter(Boolean), error: null };
}

async function send() {
  const input = $("input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  $("sendBtn").disabled = true;
  addMsg("user", text);
  history.push({ role: "user", content: text });
  const slot = addMsg("assistant", "");
  const t0 = performance.now();
  const model = $("modelSel").value;
  const useTools = $("toolToggle").checked;
  let msgs = history.slice(-12);

  try {
    for (let round = 0; round < 3; round++) {
      const body = { model, stream: true, messages: msgs };
      if (assistantKey) body.genie_assistant = assistantKey;
      if (useTools) body.tools = TOOL_DEFS;

      const res = await streamOnce(body, slot, round === 0);
      if (res.error) {
        slot.body.textContent = (res.text ? res.text + "\n" : "") + "错误：" + res.error;
        slot.body.className = "body err";
        break;
      }
      if (res.calls.length) {
        const toolMsgs = [];
        for (const tc of res.calls) {
          let args = {};
          try { args = JSON.parse(tc.function.arguments || "{}"); } catch { args = {}; }
          const out = execTool(tc.function.name, args);
          toolCard(slot, tc.function.name, args, out);
          toolMsgs.push({ role: "tool", tool_call_id: tc.id, content: out });
        }
        msgs = [...msgs, { role: "assistant", content: null, tool_calls: res.calls }, ...toolMsgs];
        continue;
      }
      history.push({ role: "assistant", content: res.text });
      const ms = Math.round(performance.now() - t0);
      slot.meta.textContent = ms + " ms · " + model + (assistantKey ? " · " + assistantKey : "") +
        (useTools ? " · tools" : "");
      $("latTag").textContent = ms + " ms";
      break;
    }
  } catch (e) {
    slot.body.textContent = "网络错误：" + e;
    slot.body.className = "body err";
  } finally {
    $("sendBtn").disabled = false;
    poll();
  }
}

$("sendBtn").onclick = send;
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("clearBtn").onclick = () => { $("log").innerHTML = ""; history = []; };

document.querySelectorAll('.tabs button').forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll('.tabs button').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    $('chatPane').hidden = btn.dataset.tab !== 'chat';
    $('imagePane').hidden = btn.dataset.tab !== 'image';
  };
});

async function generateImage() {
  const prompt = $('imgPrompt').value.trim();
  if (!prompt) return;
  const btn = $('imgBtn');
  btn.disabled = true;
  $('imgOut').innerHTML = '<div class="hint">请求中…</div>';
  const t0 = performance.now();
  try {
    const r = await fetch('/v1/images/generations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, model: 'genie-image' }),
    });
    const j = await r.json();
    const ms = Math.round(performance.now() - t0);
    if (!r.ok) {
      const e = j.error || {};
      const steps = (j.genie && j.genie.steps) || [];
      const stepText = steps.map((s) => `${s.status} · ${s.service} · step ${s.step}`).join('<br>');
      $('imgOut').innerHTML =
        `<div class="gate"><b>${e.code}</b> — ${e.message}` +
        (stepText ? `<div class="steps">${stepText}</div>` : '') + '</div>' +
        `<div class="meta">${ms} ms · 上游 agent 已进入 text2image，工具执行被账号权益拦截</div>`;
    } else {
      const d = (j.data || [])[0] || {};
      $('imgOut').innerHTML = d.url
        ? `<img src="${d.url}" alt="generated"><div class="meta">${ms} ms · ${d.revised_prompt || ''}</div>`
        : `<div class="hint">上游未返回图片：${d.note || ''}</div>`;
    }
  } catch (e) {
    $('imgOut').innerHTML = `<div class="err">网络错误：${e}</div>`;
  } finally {
    btn.disabled = false;
    poll();
  }
}
$('imgBtn').onclick = generateImage;

loadModels();
loadAssistants();
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
